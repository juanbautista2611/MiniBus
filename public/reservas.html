<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Reservas - MiniBus Zavalla</title>
    <!-- Google Fonts: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="app-body py-4">

    <div class="container main-app-container">

        <!-- HEADER SUPERIOR -->
        <header class="card border-0 shadow-sm p-3 p-md-4 mb-4 header-card rounded-4 bg-white">
            <div class="d-flex justify-content-between align-items-center">
                <div class="d-flex align-items-center gap-3">
                    <div class="brand-icon-wrapper d-flex align-items-center justify-content-center">
                        <i class="bi bi-ticket-perforated-fill text-white fs-4"></i>
                    </div>
                    <div>
                        <h1 class="h5 fw-bold mb-0 text-dark">MiniBus Zavalla</h1>
                        <small class="text-muted">Mis Pasajes y Reservas Activas</small>
                    </div>
                </div>

                <button onclick="window.location.href='index.html'" class="btn btn-outline-secondary d-flex align-items-center gap-2 px-3 py-2 rounded-pill fw-semibold">
                    <i class="bi bi-arrow-left"></i>
                    <span>Volver al inicio</span>
                </button>
            </div>
        </header>

        <main class="row g-4 justify-content-center">

            <!-- COLUMNA PRINCIPAL: RESERVA ACTIVA + HISTORIAL -->
            <div class="col-12 col-lg-9 col-xl-8 d-flex flex-column gap-4">

                <!-- TARJETA PRÓXIMO VIAJE -->
                <section class="card hero-viaje border-0 shadow-sm p-4 p-md-5 rounded-4 bg-white">
                    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
                        <span class="badge badge-subtitulo px-3 py-2 rounded-pill fw-bold">NUEVA RESERVA</span>
                        <span class="badge bg-success-subtle text-success-emphasis border border-success-subtle px-3 py-2 rounded-pill fw-bold">
                            <i class="bi bi-circle-fill me-1 small-dot"></i> Habilitado
                        </span>
                    </div>

                    <h2 id="tituloViaje" class="viaje-titulo h4 fw-bold mb-4 text-dark">Cargando fecha del viaje...</h2>

                    <!-- TRAMOS (IDA / VUELTA) -->
                    <div class="row g-3 mb-4">
                        
                        <!-- TRAMO IDA -->
                        <div class="col-12 col-md-6">
                            <label for="checkIda" class="w-100 h-100 m-0">
                                <div class="card card-tramo p-3 p-md-4 h-100 rounded-4 cursor-pointer position-relative">
                                    <div class="d-flex justify-content-between align-items-start mb-3">
                                        <div>
                                            <span class="tramo-tag small fw-bold text-uppercase d-inline-flex align-items-center gap-1 mb-1">
                                                <i class="bi bi-arrow-up-right text-success"></i> Tramo Ida
                                            </span>
                                            <div class="hora-display fw-bold display-6">07:00 <span class="fs-6 fw-normal text-muted">hs</span></div>
                                        </div>
                                        <input type="checkbox" id="checkIda" class="form-check-input custom-checkbox fs-4" checked>
                                    </div>
                                    
                                    <div class="itinerario-timeline small my-3">
                                        <div class="timeline-step">
                                            <span class="dot origin"></span>
                                            <span class="fw-semibold text-dark">Plaza Sarmiento</span>
                                        </div>
                                        <div class="timeline-line"></div>
                                        <div class="timeline-step">
                                            <span class="dot destination"></span>
                                            <span class="fw-semibold text-dark">Facultad FcAgr</span>
                                        </div>
                                    </div>

                                    <div class="mt-auto pt-2 border-top">
                                        <div class="d-flex justify-content-between align-items-center small fw-semibold">
                                            <span class="text-muted">Cupos</span>
                                            <span id="cuposIda" class="cupos badge bg-light text-dark border">25 disponibles</span>
                                        </div>
                                    </div>
                                </div>
                            </label>
                        </div>

                        <!-- TRAMO VUELTA -->
                        <div class="col-12 col-md-6">
                            <label for="checkVuelta" class="w-100 h-100 m-0">
                                <div class="card card-tramo p-3 p-md-4 h-100 rounded-4 cursor-pointer position-relative">
                                    <div class="d-flex justify-content-between align-items-start mb-3">
                                        <div>
                                            <span class="tramo-tag small fw-bold text-uppercase d-inline-flex align-items-center gap-1 mb-1">
                                                <i class="bi bi-arrow-down-left text-success"></i> Tramo Vuelta
                                            </span>
                                            <div class="hora-display fw-bold display-6">17:15 <span class="fs-6 fw-normal text-muted">hs</span></div>
                                        </div>
                                        <input type="checkbox" id="checkVuelta" class="form-check-input custom-checkbox fs-4" checked>
                                    </div>

                                    <div class="itinerario-timeline small my-3">
                                        <div class="timeline-step">
                                            <span class="dot origin"></span>
                                            <span class="fw-semibold text-dark">Facultad FcAgr</span>
                                        </div>
                                        <div class="timeline-line"></div>
                                        <div class="timeline-step">
                                            <span class="dot destination"></span>
                                            <span class="fw-semibold text-dark">Plaza Sarmiento</span>
                                        </div>
                                    </div>

                                    <div class="mt-auto pt-2 border-top">
                                        <div class="d-flex justify-content-between align-items-center small fw-semibold">
                                            <span class="text-muted">Cupos</span>
                                            <span id="cuposVuelta" class="cupos badge bg-light text-dark border">25 disponibles</span>
                                        </div>
                                    </div>
                                </div>
                            </label>
                        </div>

                    </div>

                    <button type="button" onclick="confirmarReserva()" class="btn btn-primary-custom w-100 py-3 fw-bold rounded-4 shadow-sm fs-5 d-flex align-items-center justify-content-center gap-2">
                        <i class="bi bi-bus-front"></i>
                        <span>Confirmar reserva de asiento</span>
                    </button>
                </section>

                <!-- MIS RESERVAS ACTIVAS -->
                <section class="card border-0 shadow-sm p-4 rounded-4 bg-white">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h3 id="tituloSeccionReservas" class="h5 fw-bold mb-0 text-dark">📋 Mis reservas activas</h3>
                        <small id="subtituloSeccionReservas" class="text-muted">Historial de pasajes</small>
                    </div>

                    <div id="misReservas" class="d-flex flex-column gap-2">
                        <div class="p-4 text-center text-muted border border-dashed rounded-4">
                            Cargando mis reservas...
                        </div>
                    </div>
                </section>

            </div>

        </main>
    </div>

    <!-- NAVEGACIÓN INFERIOR MÓVIL -->
    <div class="bottom-nav d-lg-none fixed-bottom bg-white border-top py-2 px-3 shadow-lg">
        <div class="d-flex justify-content-around text-center">
            <a href="index.html" class="nav-item text-decoration-none text-muted">
                <i class="bi bi-house-door fs-5 d-block"></i>
                <span>Inicio</span>
            </a>
            <a href="reservas.html" class="nav-item text-decoration-none text-success fw-bold">
                <i class="bi bi-ticket-perforated-fill fs-5 d-block"></i>
                <span>Reservas</span>
            </a>
            <a href="perfil.html" class="nav-item text-decoration-none text-muted">
                <i class="bi bi-person fs-5 d-block"></i>
                <span>Perfil</span>
            </a>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
